    <!-- ─── Main panel: chat ───────────────────────────────────────────────── -->
    <main class="chat">
      <header class="chat-header">
        <button class="icon-btn sidebar-toggle" id="btn-sidebar-toggle" aria-label="Toggle sidebar">
          <i class="fa-solid fa-bars"></i>
        </button>
        <div class="chat-title" id="chat-title"></div>
        <div class="chat-controls">
          <div class="theme-cycler">
            <button class="icon-btn" id="btn-theme" aria-label="Change theme" title="Change theme">
              <i class="fa-solid fa-palette"></i>
            </button>
            <div class="theme-menu" id="theme-menu" role="menu" hidden></div>
          </div>
        </div>
      </header>

      <div class="messages" id="messages" role="log" aria-live="polite"></div>

      <form class="prompt-panel" id="prompt-form">
        <textarea
          id="prompt-input"
          class="prompt-input"
          placeholder="Ask me anything…"
          rows="1"
          autocomplete="off"
          autocorrect="on"
          spellcheck="true"
        ></textarea>
        <div class="prompt-bar">
          <span class="model-badge"><i class="fa-solid fa-circle"></i> Gemini 2.5 Flash</span>
          <button class="btn-send" id="btn-send" type="submit" aria-label="Send" disabled>
            <i class="fa-solid fa-arrow-up"></i>
          </button>
        </div>
      </form>
    </main>
