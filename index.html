<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ben Duffey: Founder &amp; Chief Engineer at NICE SPACESHIP</title>
  <meta name="description" content="Chat with Ben Duffey's AI assistant. Ben is the solo technical founder of NICE SPACESHIP. Ask about his work, NICE, or anything else." />
  <meta name="author" content="Ben Duffey" />
  <link rel="canonical" href="https://benduffey.com/" />
  <link rel="icon" href="/assets/nice-mark.svg" type="image/svg+xml" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Ben Duffey: Founder &amp; Chief Engineer at NICE SPACESHIP" />
  <meta property="og:description" content="Chat with Ben Duffey's AI assistant. Ask about his work, NICE SPACESHIP, or anything else." />
  <meta property="og:url" content="https://benduffey.com/" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400&family=Orbitron:wght@900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/css/app.css?v=4" />
</head>
<body>
  <div class="app">
    <!-- ─── Sidebar: name logo + chats list (collapsible) ─────────────────── -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="brand-text">BEN DUFFEY</span>
        <button class="icon-btn sidebar-collapse" id="btn-sidebar-collapse" aria-label="Collapse sidebar" title="Collapse sidebar">
          <i class="fa-solid fa-table-columns"></i>
        </button>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-section-header">
          <span class="sidebar-section-title">Chats</span>
          <button class="icon-btn" id="btn-new-chat" title="New chat" aria-label="New chat">
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>
        <div class="chat-list" id="chat-list" role="list"></div>
      </div>
    </aside>

    <!-- ─── Main panel: chat ───────────────────────────────────────────────── -->
    <main class="chat">
      <header class="chat-header">
        <button class="icon-btn sidebar-toggle" id="btn-sidebar-toggle" aria-label="Show sidebar" title="Show sidebar">
          <i class="fa-solid fa-bars"></i>
        </button>
        <div class="chat-title" id="chat-title"></div>
        <div class="chat-controls">
          <button class="icon-btn theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
            <i class="fa-solid fa-moon"></i>
          </button>
        </div>
      </header>

      <!-- chat-body holds the welcome block, the message log, the prompt box,
           and the starter chips. The body.chat-empty state centers the
           greeting + prompt box + chips; the conversation state drops the
           prompt box to the bottom and shows the message log. -->
      <div class="chat-body" id="chat-body">
        <div class="welcome" id="welcome">
          <h1 class="welcome-greeting" id="welcome-greeting"></h1>
        </div>

        <div class="messages" id="messages" role="log" aria-live="polite"></div>

        <form class="prompt-form" id="prompt-form">
          <div class="prompt-box">
            <textarea
              id="prompt-input"
              class="prompt-input"
              placeholder="Ask me about Ben, NICE SPACESHIP, or anything…"
              rows="1"
              autocomplete="off"
              autocorrect="on"
              spellcheck="true"
            ></textarea>
            <div class="prompt-bar">
              <span class="model-badge"><i class="fa-solid fa-circle"></i> Gemini 2.5 Flash</span>
              <button class="btn-send" id="btn-send" type="submit" aria-label="Send" disabled>
                <i class="fa-solid fa-arrow-up"></i>
              </button>
            </div>
          </div>
        </form>

        <div class="welcome-chips" id="welcome-chips"></div>
      </div>
    </main>
  </div>

  <script src="/js/theme.js?v=2"></script>
  <script src="/js/chat.js?v=3"></script>
  <script src="/js/app.js?v=3"></script>
</body>
</html>
